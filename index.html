<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>护理抢救记录 · 工作站</title>
<style>
:root{
  --bg:#edf2f9; --card:#ffffff; --pri:#2563eb; --pri-d:#1d4ed8; --pri-l:#eef5ff;
  --txt:#0f172a; --sub:#5b6e8c; --line:#dde5f0; --danger:#dc2626; --ok:#16a34a;
  --radius:16px;
  --shadow:0 2px 8px rgba(15,23,42,.05), 0 12px 30px -12px rgba(15,23,42,.15);
  --shadow-hover:0 8px 28px -8px rgba(37,99,235,.25);
  --transition: all .22s cubic-bezier(.2,.8,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
}
@media(min-width:900px){
  body{
    background-image:radial-gradient(circle at 20% 20%, rgba(37,99,235,.035) 0%, transparent 55%),
                     radial-gradient(circle at 80% 80%, rgba(56,189,248,.04) 0%, transparent 55%);
    background-attachment:fixed;
  }
}
.hidden{display:none!important}

/* ========== 认证页 ========== */
#authPage{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#38bdf8 100%);
  padding:20px;overflow-y:auto;
}
.auth-box{
  background:#fff;border-radius:22px;width:100%;max-width:420px;
  box-shadow:0 20px 60px -10px rgba(0,0,0,.4);
  overflow:hidden;animation:authIn .35s cubic-bezier(.2,.9,.3,1);
  margin:auto;
}
@keyframes authIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-hd{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;padding:26px 28px 22px;text-align:center;
}
.auth-hd .logo{
  width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:26px;margin-bottom:12px;backdrop-filter:blur(4px);
}
.auth-hd h1{margin:0;font-size:20px;font-weight:750;letter-spacing:.5px}
.auth-hd p{margin:6px 0 0;font-size:12.5px;opacity:.9}
.auth-tabs{display:flex;border-bottom:1.5px solid var(--line);}
.auth-tabs button{
  flex:1;border:0;background:none;padding:14px;font-size:14px;font-family:inherit;
  color:var(--sub);font-weight:600;cursor:pointer;transition:var(--transition);
  position:relative;
}
.auth-tabs button.active{color:var(--pri)}
.auth-tabs button.active::after{
  content:'';position:absolute;left:20%;right:20%;bottom:-1.5px;height:3px;
  background:var(--pri);border-radius:3px 3px 0 0;
}
.auth-bd{padding:24px 28px 28px}
.auth-bd label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--sub);font-weight:500;margin-bottom:16px}
.auth-bd input,.auth-bd select{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:15px;color:var(--txt);background:#fbfdff;outline:none;font-family:inherit;
  transition:var(--transition);min-height:46px;
}
.auth-bd input:focus,.auth-bd select:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.auth-bd input[readonly]{background:#f1f5f9;color:var(--sub);cursor:not-allowed}
.auth-btn{
  width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-family:inherit;
  font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pri),#4285f4);
  cursor:pointer;transition:var(--transition);box-shadow:0 6px 22px -8px rgba(37,99,235,.9);
}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px -8px rgba(37,99,235,1)}
.auth-btn:active{transform:scale(.98)}
.auth-hint{font-size:12px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.8}
.auth-link{color:var(--pri);cursor:pointer;font-weight:600;padding:2px 4px}
.auth-link:hover{text-decoration:underline}
.auth-err{
  background:#fef2f2;border:1px solid #fecaca;color:var(--danger);
  border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;
}
.auth-admin-hint{
  margin-top:18px;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;
  border-radius:10px;font-size:12px;color:#92400e;line-height:1.6;
}
.auth-admin-hint b{color:#b45309}

/* ========== 主应用 ========== */
.app{max-width:1060px;margin:0 auto;padding:0 12px 90px}
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#1e4fd8 0%,#3b7ef0 50%,#34b3f5 100%);
  color:#fff;padding:14px 20px calc(14px + env(safe-area-inset-top,0)/2);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 6px 28px -8px rgba(37,99,235,.55);
  border-radius:0 0 22px 22px;margin:0 -12px;
}
@media(min-width:900px){.topbar{border-radius:0 0 26px 26px;padding:16px 28px;margin:0 -12px}}
.topbar .ttl{font-size:18px;font-weight:750;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.topbar .ttl::before{content:'';width:7px;height:19px;border-radius:4px;background:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.4)}
.topbar .sub{font-size:12px;opacity:.9;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;letter-spacing:.3px}
.tb-right{display:flex;align-items:center;gap:10px;flex:none}
.tb-user{
  display:flex;align-items:center;gap:8px;font-size:13px;
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);
  border-radius:13px;padding:8px 14px;cursor:pointer;transition:var(--transition);
  backdrop-filter:blur(8px);color:#fff;font-family:inherit;
}
.tb-user:hover{background:rgba(255,255,255,.26)}
.tb-user .avatar{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--pri);
  display:inline-flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;
}
.tb-admin-btn{
  background:linear-gradient(135deg,#f59e0b,#ea580c)!important;
  border-color:transparent!important;color:#fff!important;font-weight:700!important;
}

/* 患者管理页 */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0 16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:20px;font-weight:750;display:flex;align-items:center;gap:10px}
.page-head h2 .badge{font-size:12px;font-weight:600;color:var(--pri);background:var(--pri-l);border-radius:20px;padding:3px 12px}
.page-head .actions{display:flex;gap:10px;flex-wrap:wrap}

.patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:8px}
.pat-card{
  background:#fff;border-radius:16px;padding:18px 20px;
  box-shadow:var(--shadow);border:1.5px solid transparent;
  cursor:pointer;transition:var(--transition);position:relative;
  display:flex;flex-direction:column;gap:12px;
}
.pat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#b9d3ff}
.pat-card.current{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.12),var(--shadow-hover)}
.pat-card.current::after{
  content:'当前';position:absolute;top:14px;right:14px;
  font-size:11px;font-weight:700;color:#fff;background:var(--pri);
  border-radius:20px;padding:3px 10px;
}
.pat-card .pc-hd{display:flex;align-items:center;gap:10px;min-width:0}
.pat-card .pc-name{font-size:17px;font-weight:750;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pat-card .pc-meta{font-size:12.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}
.pat-card .pc-diag{
  font-size:13px;color:var(--txt);background:#f8fafc;border-radius:10px;
  padding:8px 12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pat-card .pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pat-card .pc-stat{text-align:center}
.pat-card .pc-stat b{display:block;font-size:17px;font-weight:750;color:var(--pri);line-height:1.2}
.pat-card .pc-stat span{font-size:11px;color:var(--sub);margin-top:2px;display:block}
.pat-card .pc-acts{display:flex;gap:8px;opacity:0;transition:var(--transition);position:absolute;top:12px;right:12px}
.pat-card.current .pc-acts{opacity:1;top:auto;bottom:14px;right:14px}
.pat-card:hover .pc-acts{opacity:1}
.pc-acts button{
  border:1.5px solid var(--line);background:#fff;color:var(--sub);
  border-radius:9px;padding:5px 10px;font-size:12px;font-family:inherit;font-weight:600;
  cursor:pointer;transition:var(--transition);
}
.pc-acts button:hover{background:#eef5ff;border-color:#b9d3ff;color:var(--pri)}
.pc-acts button.del{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.pc-acts button.del:hover{background:#fee2e2}

.empty-state{text-align:center;padding:80px 20px;color:var(--sub)}
.empty-state .big{font-size:52px;opacity:.3;display:block;margin-bottom:14px}
.empty-state p{margin:0 0 20px;font-size:15px;line-height:1.8}

/* 卡片 / 表单 */
.card{
  background:var(--card);border-radius:var(--radius);margin:16px 0;
  padding:0 20px 20px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid rgba(226,232,240,.85);transition:var(--transition);
}
.card>summary{
  list-style:none;cursor:pointer;padding:18px 0 15px;font-weight:700;font-size:16px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px;
  color:var(--txt);transition:var(--transition);user-select:none;
}
.card>summary:hover{color:var(--pri)}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:'▾';margin-left:auto;color:var(--sub);font-size:15px;transition:transform .25s;font-weight:400}
.card:not([open])>summary{border-bottom-color:transparent;margin-bottom:0;padding-bottom:18px}
.card:not([open])>summary::after{transform:rotate(-90deg)}
.card>summary .idx{
  width:26px;height:26px;border-radius:9px;
  background:linear-gradient(135deg,var(--pri-l),#d8e8ff);color:var(--pri);
  font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-weight:750;box-shadow:0 2px 6px -2px rgba(37,99,235,.3);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}}
.span2{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--sub);min-width:0;font-weight:500}
input,select,textarea{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;
  font-size:15px;color:var(--txt);background:#fbfdff;outline:none;font-family:inherit;
  transition:var(--transition);min-height:44px;
}
input:hover,select:hover,textarea:hover{border-color:#c5d5eb}
input:focus,select:focus,textarea:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
textarea{resize:none;min-height:84px;line-height:1.65}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1;min-width:0}
.mini-select{flex:none;width:82px;padding:11px 8px;font-size:14px;text-align:center;background:#eef5ff;border-color:#d0e2ff;color:var(--pri);font-weight:650;border-radius:12px;min-height:44px;cursor:pointer;}
.mini{flex:none;border:1.5px solid #d0e2ff;background:#eef5ff;color:var(--pri);border-radius:12px;padding:0 14px;font-size:13px;font-family:inherit;white-space:nowrap;font-weight:650;min-height:44px;cursor:pointer;transition:var(--transition);}
.mini:hover{background:#dcebff;border-color:var(--pri)}
.field{margin-top:18px}
.field:first-child{margin-top:0}
.lbl{font-size:13px;color:var(--sub);margin-bottom:7px;font-weight:600;letter-spacing:.2px}

.phrase-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.phrase-bar select{flex:1;min-width:160px;font-size:13px;min-height:38px;padding:8px 12px;border-radius:10px;background:#f6faff;border-color:#d0e2ff;color:var(--pri);font-weight:600}
.phrase-bar button{flex:none;border:1.5px solid #d0e2ff;background:#eef5ff;color:var(--pri);border-radius:10px;padding:0 14px;font-size:12.5px;font-family:inherit;font-weight:650;min-height:38px;cursor:pointer;transition:var(--transition);white-space:nowrap}
.phrase-bar button:hover{background:#dcebff;border-color:var(--pri)}

/* 短语分组 */
.phrase-group-title{
  font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-l);
  padding:6px 12px;border-radius:8px;margin:14px 0 8px;
  display:inline-block;
}
.phrase-grid{
  display:grid;grid-template-columns:1fr;gap:8px;
}

.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:7px}
.chip{
  border:1.5px solid var(--line);background:#f8fafc;color:var(--txt);
  border-radius:999px;padding:9px 16px;font-size:13.5px;font-family:inherit;
  display:inline-flex;align-items:center;gap:8px;line-height:1.25;transition:all .18s;cursor:pointer;font-weight:500;
}
.chip:hover{border-color:#b9d3ff;background:#f2f8ff;transform:translateY(-1px)}
.chip i{font-style:normal;font-size:11px;color:var(--sub);background:#e4ecf7;border-radius:50%;width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:650;transition:var(--transition);}
.chip.active{background:linear-gradient(135deg,var(--pri),#4285f4);border-color:transparent;color:#fff;box-shadow:0 4px 14px -3px rgba(37,99,235,.55);transform:translateY(-1px);}
.chip.active i{background:rgba(255,255,255,.35);color:#fff}

.io-title{font-size:13px;color:var(--sub);margin:18px 0 10px;font-weight:650;display:flex;align-items:center;justify-content:space-between;}
.io-title button{border:1.5px dashed #b0d0ff;color:var(--pri);background:#f6faff;border-radius:10px;padding:6px 15px;font-size:13px;font-family:inherit;font-weight:650;cursor:pointer;transition:var(--transition);}
.io-title button:hover{background:#e8f2ff;border-color:var(--pri)}
.io-row{display:grid;grid-template-columns:1fr 96px 38px;gap:9px;margin-bottom:9px}
.io-row.out{grid-template-columns:1fr 82px 82px 38px}
.io-row input{padding:9px 12px;font-size:14px;min-height:42px}
.del{border:0;background:#fee2e2;color:var(--danger);border-radius:11px;font-size:19px;line-height:1;font-family:inherit;padding:0;font-weight:650;cursor:pointer;transition:var(--transition);}
.del:hover{background:#fecaca}

.actionbar{display:flex;gap:11px;margin:20px 0 34px;flex-wrap:wrap}
.btn{
  flex:1;border-radius:14px;padding:14px 14px;font-size:15px;font-family:inherit;
  border:1.5px solid var(--line);background:#fff;color:var(--txt);font-weight:650;
  transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;min-width:100px;
}
.btn:hover{background:#f5f9ff;border-color:#c5d5eb;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--pri),#4285f4);border-color:transparent;color:#fff;flex:1.6;box-shadow:0 6px 22px -8px rgba(37,99,235,.9);}
.btn.primary:hover{box-shadow:0 8px 28px -8px rgba(37,99,235,1);transform:translateY(-2px)}
.btn.ghost{color:var(--sub);font-weight:550;background:#f8fafc}
.btn.danger{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.btn.danger:hover{background:#fee2e2}
.btn:active{transform:scale(.98)}
.btn.sm{flex:none;padding:10px 18px;font-size:13.5px;min-width:0}

.listbar{display:flex;gap:11px;padding:18px 0 6px;flex-wrap:wrap}
.listbar .btn{padding:12px 10px;font-size:13.5px;min-width:0;flex:1 1 calc(50% - 6px)}
@media(min-width:900px){.listbar .btn{flex:1 1 auto;font-size:14px;padding:13px 18px}}

.empty{text-align:center;color:var(--sub);padding:70px 20px;font-size:15px;line-height:2}
.empty .big{font-size:42px;display:block;margin-bottom:12px;opacity:.3}
.rec{
  background:#fff;border-radius:var(--radius);margin:14px 0;padding:18px 20px;
  box-shadow:var(--shadow);border:1px solid rgba(226,232,240,.85);transition:var(--transition);
}
.rec:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.rec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.rec-t{font-weight:750;color:var(--pri);font-size:15px;display:inline-flex;align-items:center;gap:8px;}
.rec-t::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pri);opacity:.8;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.rec-acts{display:flex;gap:8px;flex:none}
.rec-acts button{border:1.5px solid var(--line);background:#f8fafc;color:var(--sub);border-radius:9px;padding:6px 14px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;transition:var(--transition);}
.rec-acts button:hover{background:#eef5ff;border-color:#b9d3ff;color:var(--pri)}
.rec-acts button[data-act="del"]{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.rec-acts button[data-act="del"]:hover{background:#fee2e2;border-color:#fca5a5}
.kv{display:flex;gap:10px;font-size:13.5px;padding:4px 0;line-height:1.6}
.kv .k{color:var(--sub);flex:none;min-width:84px;font-weight:500}
.kv .v{color:var(--txt);word-break:break-all;white-space:pre-wrap}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:1060px;margin:0 auto;
  display:flex;background:rgba(255,255,255,.97);border-top:1.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0);
  box-shadow:0 -6px 28px -10px rgba(15,23,42,.22);backdrop-filter:blur(12px);
}
.tabbar button{
  flex:1;border:0;background:none;padding:11px 6px 13px;font-size:12px;
  color:var(--sub);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:color .18s;cursor:pointer;font-weight:500;
}
.tabbar button .ic{font-size:21px;line-height:1;transition:var(--transition)}
.tabbar button:hover{color:var(--pri)}
.tabbar button.active{color:var(--pri);font-weight:750}
.tabbar button.active .ic{transform:scale(1.1)}

/* 一键到顶/到底按钮 */
.scroll-fabs{
  position:fixed;right:18px;bottom:92px;z-index:40;
  display:flex;flex-direction:column;gap:10px;
}
.scroll-fab{
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--line);background:rgba(255,255,255,.97);color:var(--pri);
  font-size:19px;box-shadow:0 6px 20px -5px rgba(15,23,42,.3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);font-family:inherit;font-weight:750;backdrop-filter:blur(8px);
}
.scroll-fab:hover{background:var(--pri);color:#fff;border-color:var(--pri);transform:scale(1.08);box-shadow:0 8px 24px -5px rgba(37,99,235,.6)}
.scroll-fab:active{transform:scale(.92)}
.scroll-fab[data-hidden="1"]{opacity:0;pointer-events:none;transform:scale(.8)}

.toast{
  position:fixed;left:50%;bottom:108px;transform:translate(-50%,10px);
  background:rgba(15,23,42,.94);color:#fff;padding:13px 26px;border-radius:26px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.32s;z-index:99;
  max-width:88vw;text-align:center;line-height:1.55;backdrop-filter:blur(10px);
  box-shadow:0 12px 36px -8px rgba(0,0,0,.55);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.modal{
  position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);
}
@media(min-width:600px){.modal{align-items:center;padding:24px}}
.modal.show{display:flex}
.modal-box{
  background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:640px;
  max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -12px 50px rgba(15,23,42,.35);
  animation:slideUp .3s cubic-bezier(.2,.9,.3,1);
}
@media(min-width:600px){.modal-box{border-radius:20px;max-width:720px}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.3}to{transform:translateY(0);opacity:1}}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px;font-weight:750;font-size:16px;border-bottom:1.5px solid var(--line);
}
.modal-hd button{
  border:0;background:#f1f5f9;width:32px;height:32px;border-radius:50%;
  font-size:15px;color:var(--sub);line-height:1;font-family:inherit;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);
}
.modal-hd button:hover{background:#e2e8f0;color:var(--txt)}
.modal-bd{padding:20px 22px 26px;overflow:auto}
.modal-ft{
  padding:14px 22px calc(16px + env(safe-area-inset-bottom,0));border-top:1.5px solid var(--line);
  display:flex;gap:10px;background:#fafcff;
}
.modal-ft .btn{flex:1}
.hint{font-size:13px;color:var(--sub);margin:0 0 14px;line-height:1.7}

.phrase-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f8fafc;border-radius:12px;margin-bottom:9px;border:1.5px solid var(--line);transition:var(--transition);}
.phrase-item:hover{background:#f2f8ff;border-color:#b9d3ff}
.phrase-item span{flex:1;font-size:13.5px;color:var(--txt);line-height:1.5;word-break:break-all}
.phrase-item button{flex:none;border:1.5px solid #fecaca;background:#fef2f2;color:var(--danger);border-radius:8px;padding:5px 12px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:var(--transition);}
.phrase-add{display:flex;gap:9px;margin-bottom:16px}
.phrase-add input{flex:1}
.phrase-add button{flex:none;border:0;border-radius:12px;padding:0 20px;font-size:14px;font-family:inherit;font-weight:650;color:#fff;background:linear-gradient(135deg,var(--pri),#4285f4);cursor:pointer;transition:var(--transition);}

.search-bar input{
  width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);
  font-size:14.5px;margin-bottom:16px;background:#f8fafc;transition:var(--transition);
}
.search-bar input:focus{background:#fff;border-color:var(--pri);box-shadow:0 0 0 4px rgba(37,99,235,.1)}

/* 管理员面板 */
.admin-tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:16px;overflow-x:auto;}
.admin-tabs button{
  flex:1;min-width:80px;border:0;background:none;padding:10px 8px;
  font-size:13px;font-family:inherit;color:var(--sub);font-weight:600;
  cursor:pointer;border-bottom:2.5px solid transparent;transition:var(--transition);
  white-space:nowrap;
}
.admin-tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
.admin-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.admin-stats > div{background:#fff;border-radius:14px;padding:16px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.admin-stats b{display:block;font-size:26px;font-weight:750;color:var(--pri);line-height:1.2}
.admin-stats span{font-size:12px;color:var(--sub)}
.admin-user-row,.admin-pat-row{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:#f8fafc;border-radius:12px;margin-bottom:9px;
  border:1.5px solid var(--line);
}
.admin-user-row .aur-info,.admin-pat-row > div{flex:1;min-width:0}
.admin-user-row b,.admin-pat-row b{display:block;font-size:14.5px;color:var(--txt);font-weight:650;word-break:break-all}
.admin-user-row span,.admin-pat-row span{display:block;font-size:12px;color:var(--sub);margin-top:3px;word-break:break-all}
.admin-user-row .aur-acts{display:flex;gap:7px;flex:none}
.admin-user-row button,.admin-pat-row button{
  border:1.5px solid var(--line);background:#fff;color:var(--sub);
  border-radius:9px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:600;
  cursor:pointer;transition:var(--transition);white-space:nowrap;
}
.admin-user-row button:hover{background:#eef5ff;border-color:#b9d3ff;color:var(--pri)}
.admin-user-row button.del,.admin-pat-row button.del{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.admin-user-row button.del:hover,.admin-pat-row button.del:hover{background:#fee2e2}
.admin-badge{
  display:inline-block;font-size:10.5px;font-weight:700;
  background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;
  padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;
}

/* 粘贴记录选择：记录卡片样式 */
.paste-pick-item{
  text-align:left;border:1.5px solid var(--line);background:#fbfdff;border-radius:14px;
  padding:14px 16px;font-family:inherit;display:flex;flex-direction:column;gap:6px;
  cursor:pointer;width:100%;margin-bottom:9px;transition:var(--transition);
}
.paste-pick-item:hover{background:#f2f8ff;border-color:#b9d3ff;transform:translateY(-1px)}

#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:6mm 8mm;}
  html,body{background:#fff!important;padding:0!important;margin:0!important;width:auto!important;}
  body > *:not(#printArea){display:none!important;}
  #printArea{display:block!important;position:static!important;width:100%!important;}
  #printArea .print-page{display:flex;flex-direction:column;height:192mm;page-break-after:always;break-after:page;overflow:hidden;box-sizing:border-box;padding:0 2px;}

  #printArea table{width:100%!important;table-layout:fixed!important;border-collapse:collapse!important;border:none!important;box-sizing:border-box!important;flex:none;}

  #printArea tbody{display:table-row-group;}
  #printArea tr{page-break-inside:avoid;}

  #printArea td.hospital{font-size:14pt!important;font-weight:700;}

  #printArea .note span{display:inline-block;margin:0 14px 2px 0;white-space:nowrap;}
  #printArea .print-foot{margin-top:auto;padding-bottom:6mm;text-align:center;font-family:SimSun,宋体,serif;font-size:9pt;color:#000;}
}

<!-- ========== 登录/注册/找回密码 ========== -->

    <div class="auth-hd">
      <div class="logo">✚</div>
      <h1>护理抢救记录 · 工作站</h1>

</div>

<!-- ========== 主应用 ========== -->
<div class="app hidden" id="mainApp">
  <header class="topbar">
    <div style="min-width:0">
      <div class="ttl">护理抢救记录</div>
      <div class="sub" id="topSub">遵义市播州区人民医院 · 急诊科</div>
    </div>
    <div class="tb-right">
      <button class="tb-user tb-admin-btn hidden" id="btnAdminBar" type="button">🔧 管理员</button>
      <button class="tb-user" id="btnUserBar" type="button">
        <span class="avatar" id="tbAvatar">护</span>
        <span id="tbUserName">护士</span>
      </button>
    </div>
  </header>

  <!-- 患者管理 -->
  <main id="page-patients" class="page">
    <div class="page-head">
      <h2>我的患者 <span class="badge" id="patCount">0</span></h2>
      <div class="actions">
        <button class="btn sm primary" id="btnNewPatient" type="button">＋ 新建患者</button>
        <button class="btn sm" id="btnImportPatient" type="button">📥 导入数据</button>
      </div>
    </div>
    <div class="search-bar" style="max-width:400px">
      <input id="patSearch" placeholder="🔍 搜索姓名 / 门诊号 / 床号 / 诊断…" autocomplete="off">
    </div>
    <div class="patient-grid" id="patientGrid"></div>
  </main>

  <!-- 患者详情 -->
  <main id="page-detail" class="page hidden">
    <div class="page-head">
      <div style="min-width:0">
        <h2 style="font-size:18px">
          <button class="btn sm ghost" id="btnBackToPatients" type="button" style="padding:6px 14px;font-size:13px">← 返回</button>
          <span id="detailName">患者</span>
        </h2>
        <div id="detailMeta" style="font-size:13px;color:var(--sub);margin-top:6px"></div>
      </div>
      <div class="actions">
        <button class="btn sm" id="btnEditPatient" type="button">编辑</button>
        <button class="btn sm" id="btnExportExcel" type="button">导出</button>
        <button class="btn sm" id="btnPrintRecord" type="button">打印</button>
      </div>
    </div>
    <div id="detailStats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;max-width:520px"></div>
    <div class="actionbar" style="margin:6px 0 18px">
      <button class="btn primary" id="btnAddRecord" type="button">＋ 新增抢救记录</button>
      <button class="btn" id="btnPasteRecord" type="button">粘贴记录</button>
      <button class="btn danger" id="btnClearRecords" type="button">清空全部</button>
    </div>
    <div id="listBox"></div>
  </main>

  <!-- 录入表单 -->
  <main id="page-entry" class="page hidden">
    <div class="page-head">
      <h2>
        <button class="btn sm ghost" id="btnBackFromEntry" type="button" style="padding:6px 14px;font-size:13px">← 返回</button>
        <span id="entryTitle">新增抢救记录</span>
      </h2>
    </div>

    <details class="card" open>
      <summary><span class="idx">①</span>患者信息</summary>
      <div class="grid2">
        <label>科室<input id="pDept" placeholder="急诊科"></label>
        <label>床号<input id="pBed" placeholder="如 抢救1"></label>
        <label>姓名<input id="pName" placeholder="姓名"></label>
        <label>性别<select id="pGender"><option>女</option><option>男</option></select></label>
        <label>年龄
          <div class="inline">
            <input id="pAge" inputmode="numeric" placeholder="45">
            <select id="pAgeUnit" class="mini-select"><option>岁</option><option>月</option><option>日</option></select>
          </div>
        </label>
        <label>门诊号<input id="pMrn" inputmode="numeric"></label>
        <label class="span2">入院日期<input type="date" id="pAdmit"></label>
        <label class="span2">诊断<input id="pDiag" placeholder="如 多发伤"></label>
      </div>
    </details>

    <details class="card" open>
      <summary><span class="idx">②</span>生命体征</summary>
      <div class="grid2">
        <label>日期<input type="date" id="rDate"></label>
        <label>时间<input type="time" id="rTime"></label>
      </div>
      <div class="grid3" style="margin-top:14px">
        <label>体温 ℃<input id="fTemp" type="number" step="0.1" inputmode="decimal" placeholder="36.5"></label>
        <label>脉搏 次/分<input id="fPulse" type="number" inputmode="numeric" placeholder="80"></label>
        <label>心率 次/分<input id="fHr" type="number" inputmode="numeric" placeholder="80"></label>
        <label>呼吸 次/分
          <div class="inline"><input id="fRr" placeholder="16"><button type="button" class="mini" data-fill="fRr" data-val="机控">机控</button></div>
        </label>
        <label>血压 mmHg
          <div class="inline"><input id="fBp" placeholder="120/80"><button type="button" class="mini" data-fill="fBp" data-val="测不出">测不出</button></div>
        </label>
        <label>血氧饱和度 %<input id="fSpo2" type="number" inputmode="numeric" placeholder="98"></label>
      </div>
    </details>

    <details class="card" open>
      <summary><span class="idx">③</span>瞳孔</summary>
      <div class="grid2">
        <label>左眼大小 mm<input id="pupL" type="number" step="0.5" inputmode="decimal" placeholder="2"></label>

    </details>

    <details class="card" open>
      <summary><span class="idx">④</span>观察与评估</summary>
      <div class="field"><div class="lbl">意识</div><div data-mount="consciousness"></div></div>
      <div class="field"><div class="lbl">皮肤</div><div data-mount="skin"></div></div>
      <div class="field"><div class="lbl">管道护理</div><div data-mount="pipeline"></div></div>
      <div class="field"><div class="lbl">输液局部</div><div data-mount="infusion"></div></div>
      <div class="field"><div class="lbl">患肢血运</div><div data-mount="limb"></div></div>

      <div class="field"><div class="lbl">体位</div><div data-mount="position"></div></div>
    </details>

    <details class="card" open>
      <summary><span class="idx">⑤</span>护理措施</summary>
      <div class="grid2">
        <label>吸氧 升/分<input id="fOxygen" inputmode="decimal" placeholder="如 3"></label>
        <label>处置<input id="fDisposal" placeholder="如 气管插管、留置导尿"></label>
      </div>
      <div class="field"><div class="lbl">安全措施</div><div data-mount="safety"></div></div>
      <div class="field"><div class="lbl">基础护理</div><div data-mount="nursing"></div></div>
    </details>

    <details class="card" open>
      <summary><span class="idx">⑥</span>出入量</summary>
      <div class="io-title"><span>入量</span><button type="button" id="addIntake">+ 添加</button></div>
      <div id="intakeBox"></div>
      <div class="io-title"><span>出量</span><button type="button" id="addOutput">+ 添加</button></div>
      <div id="outputBox"></div>
    </details>

    <details class="card" open>
      <summary><span class="idx">⑦</span>其他观察及措施</summary>

        <select id="phraseSelect"><option value="">📌 快捷短语…</option></select>
        <button type="button" id="btnManagePhrase">管理短语</button>
      </div>
      <label>病情变化 / 抢救经过 / 特殊交班

      </label>
      <div class="grid2" style="margin-top:14px">
        <label>护士签名<input id="fNurse" placeholder="签名"></label>
        <label>记录时间<input id="fSignTime" readonly></label>
      </div>
    </details>

    <div class="actionbar">
      <button class="btn ghost" id="btnResetForm" type="button">清空</button>
      <button class="btn ghost" id="btnPickRec" type="button">选择记录</button>
      <button class="btn primary" id="btnSave" type="button">保存记录</button>
    </div>
  </main>

  <nav class="tabbar">
    <button data-page="patients" class="active" type="button"><span class="ic">👥</span>患者</button>

<script>
/* ================= 基础工具 ================= */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function pad(n){ return String(n).padStart(2, '0'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
var MM = 96 / 25.4;

function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function timeStr(){ var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function nowFull(){ return todayStr() + ' ' + timeStr(); }
function uid(){ return Date.now() + Math.floor(Math.random() * 100000); }

var toastTimer;
function toast(msg){
  var t = $('#toast');
  if (!t) return;
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3400);
}

function openModal(title, bodyHTML, footerHTML){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  var ft = $('#modalFooter');
  if (footerHTML){ ft.innerHTML = footerHTML; ft.classList.remove('hidden'); }
  else { ft.innerHTML = ''; ft.classList.add('hidden'); }
  $('#modal').classList.add('show');
}
function closeModal(){ $('#modal').classList.remove('show'); }

/* ================= 选项定义 ================= */
var GROUPS = {
  lightL:{ name:'左眼光反应', items:['灵敏','迟钝','消失'], code:{灵敏:'1',迟钝:'2',消失:'3'} },
  lightR:{ name:'右眼光反应', items:['灵敏','迟钝','消失'], code:{灵敏:'1',迟钝:'2',消失:'3'} },
  consciousness:{ name:'意识', items:['清醒','嗜睡','意识模糊','昏睡','浅昏迷','深昏迷','麻醉未醒','麻醉苏醒中'],

function toCodes(key, vals){
  var g = GROUPS[key];
  if (!g || !g.code || !vals || !vals.length) return '';
  return vals.map(function(v){ return g.code[v] || v; }).join('、');
}
function fromCodes(key, str){
  var g = GROUPS[key];
  if (!g || !g.code || !str) return [];
  var rev = {};
  Object.keys(g.code).forEach(function(k){ rev[g.code[k]] = k; });
  return String(str).split(/[、,，;；\s]+/).map(function(s){ return rev[s] || s; }).filter(Boolean);
}
function mountGroups(){
  $$('[data-mount]').forEach(function(node){
    var key = node.dataset.mount, g = GROUPS[key];
    if (!g) return;
    node.innerHTML = '<div class="chips" data-g="' + key + '" data-multi="' + (g.multi ? 1 : 0) + '">' +
      g.items.map(function(t, i){
        return '<button type="button" class="chip" data-t="' + esc(t) + '"><i>' + (i+1) + '</i>' + esc(t) + '</button>';
      }).join('') +
      '</div>';
  });
}
function getGroup(k){
  var g = document.querySelector('.chips[data-g="' + k + '"]');
  return g ? $$('.chip.active', g).map(function(c){ return c.dataset.t; }) : [];
}
function setGroup(k, vals){
  var g = document.querySelector('.chips[data-g="' + k + '"]');
  if (!g) return;
  var set = {};
  (vals || []).forEach(function(v){ set[v] = true; });
  $$('.chip', g).forEach(function(c){ c.classList.toggle('active', !!set[c.dataset.t]); });
}

/* 全局点击处理 chips 和 data-fill */
document.addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (chip) {
    var group = chip.parentElement;
    if (group.dataset.multi === '1') chip.classList.toggle('active');
    else {
      var was = chip.classList.contains('active');
      $$('.chip', group).forEach(function(c){ c.classList.remove('active'); });
      if (!was) chip.classList.add('active');
    }
    return;
  }
  var fill = e.target.closest('[data-fill]');
  if (fill) {
    var el = document.getElementById(fill.dataset.fill);
    if (!el) return;
    el.value = el.value === fill.dataset.val ? '' : fill.dataset.val;
    el.focus();
  }
});

/* ================= 用户账号系统 ================= */
var USERS_KEY = 'nursing_users_v1';
var SESSION_KEY = 'nursing_session_v1';
var ADMIN_KEY = 'nursing_admin_v1';

var users = [];
var currentUser = null;

function getAdmin(){
  try {
    var a = JSON.parse(localStorage.getItem(ADMIN_KEY) || 'null');
    if (a && a.name && a.pass) return a;
  } catch(e){}
  return { name: 'admin', pass: 'admin123' };
}
function saveAdmin(a){ localStorage.setItem(ADMIN_KEY, JSON.stringify(a)); }

function loadUsers(){
  try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch(e){ users = []; }
  if (!Array.isArray(users)) users = [];
}
function saveUsers(){ localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
function saveSession(){ localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }
function loadSession(){
  try { currentUser = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ currentUser = null; }
}

function showAuthError(elId, msg){
  var el = $('#' + elId);
  if (!el) { toast(msg); return; }
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(function(){ el.classList.add('hidden'); }, 4000);
}

function doLogin(){
  var name = $('#loginName').value.trim();
  var pass = $('#loginPass').value;
  if (!name || !pass) { showAuthError('loginErr', '请输入姓名和密码'); return; }

  var admin = getAdmin();
  if (name === admin.name && pass === admin.pass) {
    currentUser = { name: admin.name, isAdmin: true };
    saveSession();
    enterApp();
    toast('管理员登录成功');
    return;
  }

  var u = users.find(function(x){ return x.name === name; });
  if (!u) { showAuthError('loginErr', '该用户不存在，请先注册'); return; }
  if (u.pass !== pass) { showAuthError('loginErr', '密码错误'); return; }
  currentUser = { name: u.name, isAdmin: false };
  saveSession();
  enterApp();
}

function doRegister(){
  var name = $('#regName').value.trim();
  var pass = $('#regPass').value;
  var pass2 = $('#regPass2').value;
  var q = $('#regQ').value;
  var a = $('#regA').value.trim();

  if (!name || !pass || !pass2 || !q || !a) { showAuthError('regErr', '请填写所有必填项'); return; }
  if (pass.length < 4) { showAuthError('regErr', '密码至少4位'); return; }
  if (pass !== pass2) { showAuthError('regErr', '两次输入的密码不一致'); return; }
  if (name === getAdmin().name) { showAuthError('regErr', '该用户名为管理员保留，请更换'); return; }
  if (users.some(function(x){ return x.name === name; })) { showAuthError('regErr', '该姓名已注册'); return; }

  users.push({ name: name, pass: pass, question: q, answer: a, createdAt: Date.now() });
  saveUsers();
  currentUser = { name: name, isAdmin: false };
  saveSession();
  toast('注册成功，欢迎 ' + esc(name));
  enterApp();
}

function doForgot(){
  var name = $('#fgName').value.trim();
  var a = $('#fgA').value.trim();
  var newPass = $('#fgPass').value;
  if (!name || !a || !newPass) { showAuthError('fgErr', '请填写完整信息'); return; }
  var u = users.find(function(x){ return x.name === name; });
  if (!u) { showAuthError('fgErr', '该用户不存在'); return; }
  if (u.answer !== a) { showAuthError('fgErr', '密保答案错误'); return; }
  if (newPass.length < 4) { showAuthError('fgErr', '新密码至少4位'); return; }
  u.pass = newPass;
  saveUsers();
  toast('密码已重置，请使用新密码登录');
  switchAuthTab('login');
  $('#loginName').value = name;
  $('#loginPass').value = '';
}

function enterApp(){
  $('#authPage').classList.add('hidden');
  $('#mainApp').classList.remove('hidden');
  initApp();
  updateTopSub();
}

function logout(){
  if (!confirm('确定退出登录？')) return;
  clearSession();
  currentUser = null;
  $('#mainApp').classList.add('hidden');
  $('#authPage').classList.remove('hidden');
  $('#loginPass').value = '';
  switchAuthTab('login');
}

function switchAuthTab(tab){
  $$('.auth-tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
  ['login','register','forgot'].forEach(function(t){
    var el = $('#tab-' + t);
    if (el) el.classList.toggle('hidden', t !== tab);
  });
  ['loginErr','regErr','fgErr'].forEach(function(id){
    var el = $('#' + id);
    if (el) el.classList.add('hidden');
  });
}

/* ================= 认证页事件绑定（事件委托） ================= */
function bindAuth(){
  document.addEventListener('click', function(e){
    var tabBtn = e.target.closest('.auth-tabs button');
    if (tabBtn) {
      e.preventDefault();
      if (tabBtn.dataset.tab) switchAuthTab(tabBtn.dataset.tab);
      return;
    }
    var link = e.target.closest('.auth-link');
    if (link) {
      e.preventDefault();
      if (link.dataset.go) switchAuthTab(link.dataset.go);
      return;
    }
    if (e.target.closest('#btnLogin'))    { e.preventDefault(); doLogin();    return; }
    if (e.target.closest('#btnRegister')) { e.preventDefault(); doRegister(); return; }
    if (e.target.closest('#btnForgot'))   { e.preventDefault(); doForgot();   return; }
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var id = e.target.id;
    if (id === 'loginPass' || id === 'loginName') { e.preventDefault(); doLogin(); }
    else if (id === 'regA' || id === 'regPass2')  { e.preventDefault(); doRegister(); }
    else if (id === 'fgPass')                     { e.preventDefault(); doForgot(); }
  });

  document.addEventListener('input', function(e){
    if (e.target.id !== 'fgName') return;
    var name = e.target.value.trim();
    var u = users.find(function(x){ return x.name === name; });
    var fgQ = document.getElementById('fgQ');
    if (!fgQ) return;
    if (u) {
      fgQ.value = u.question || '';
      fgQ.placeholder = '';
    } else {
      fgQ.value = '';
      fgQ.placeholder = name ? '未找到该用户' : '输入姓名后自动显示';
    }
  });
}

var STORE_KEY = 'nursing_record_v3';
var store = { patients: [], currentId: null };
var editingId = null;

function loadStore(){
  try {
    var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && Array.isArray(s.patients)) store = s;
  } catch(e){}
  if (store.patients.length && (!store.currentId || !store.patients.some(function(p){ return p.id === store.currentId; }))) {
    store.currentId = store.patients[0].id;
  }
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
function curPatient(){ return store.patients.find(function(p){ return p.id === store.currentId; }) || null; }
function getRecords(){ var p = curPatient(); return p ? (p.records || []) : []; }

var P_FIELDS = { pDept:'dept', pBed:'bed', pName:'name', pGender:'gender',
                 pAge:'age', pAgeUnit:'ageUnit', pMrn:'mrn', pAdmit:'admitDate', pDiag:'diagnosis' };

function createPatient(data, silent){
  data = data || {};
  var p = {
    id: uid(),
    dept: data.dept || '急诊科',
    bed: data.bed || '',
    name: data.name || '',
    gender: data.gender || '女',
    age: data.age || '',
    ageUnit: data.ageUnit || '岁',
    mrn: data.mrn || '',
    admitDate: data.admitDate || todayStr(),
    diagnosis: data.diagnosis || '',
    records: data.records || [],
    createdAt: Date.now()
  };
  store.patients.push(p);
  store.currentId = p.id;
  saveStore();
  if (!silent) { renderPatientUI(); renderPatients(); renderList(); updateCount(); resetForm(); }
  return p;
}

function calcTotals(p){
  var intake = 0, output = 0;
  (p.records || []).forEach(function(r){
    (r.intake || []).forEach(function(i){ intake += parseFloat(i.ml) || 0; });
    (r.output || []).forEach(function(o){ output += parseFloat(o.ml) || 0; });
  });
  return { intake: Math.round(intake), output: Math.round(output), count: (p.records || []).length };
}

function renderPatientUI(){
  var p = curPatient();
  if (!p) return;
  $('#pDept').value = p.dept || '';
  $('#pBed').value = p.bed || '';
  $('#pName').value = p.name || '';
  $('#pGender').value = p.gender || '女';
  $('#pAge').value = p.age || '';
  $('#pAgeUnit').value = p.ageUnit || '岁';
  $('#pMrn').value = p.mrn || '';
  $('#pAdmit').value = p.admitDate || todayStr();
  $('#pDiag').value = p.diagnosis || '';
  updateTopSub();
}

function renderPatients(){
  var grid = $('#patientGrid');
  if (!grid) return;
  var searchEl = $('#patSearch');
  var q = (searchEl ? searchEl.value : '').trim().toLowerCase();
  var list = store.patients.slice().sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
  if (q) {
    list = list.filter(function(p){
      return (p.name || '').toLowerCase().indexOf(q) >= 0 ||
             (p.mrn || '').toLowerCase().indexOf(q) >= 0 ||
             (p.bed || '').toLowerCase().indexOf(q) >= 0 ||
             (p.diagnosis || '').toLowerCase().indexOf(q) >= 0;
    });
  }
  $('#patCount').textContent = store.patients.length;

  if (!list.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' +
      '<span class="big">🏥</span>' +
      '<p>' + (q ? '未找到匹配的患者' : '还没有患者，点击下方按钮创建第一位患者') + '</p>' +
      (!q ? '<button class="btn primary" style="max-width:220px;margin:0 auto" id="btnEmptyNew" type="button">＋ 新建患者</button>' : '') +
      '</div>';
    var b = $('#btnEmptyNew');
    if (b) b.onclick = newPatient;
    return;
  }

  grid.innerHTML = list.map(function(p){
    var t = calcTotals(p);
    var isCur = p.id === store.currentId;
    return '<div class="pat-card ' + (isCur ? 'current' : '') + '" data-pid="' + p.id + '">' +
      '<div class="pc-hd"><div class="pc-name">' + esc(p.name || '（未填姓名）') + '</div></div>' +
      '<div class="pc-meta">' +
        '<span>' + esc(p.gender || '') + (p.age ? ' · ' + esc(p.age + (p.ageUnit || '岁')) : '') + '</span>' +
        (p.bed ? '<span>· ' + esc(p.bed) + '</span>' : '') +
        (p.mrn ? '<span>· 门诊号 ' + esc(p.mrn) + '</span>' : '') +
      '</div>' +
      '<div class="pc-diag">' + (p.diagnosis ? esc(p.diagnosis) : '（无诊断）') + '</div>' +
      '<div class="pc-stats">' +
        '<div class="pc-stat"><b>' + t.count + '</b><span>记录数</span></div>' +
        '<div class="pc-stat"><b>' + t.intake + '</b><span>总入量(ml)</span></div>' +
        '<div class="pc-stat"><b>' + t.output + '</b><span>总出量(ml)</span></div>' +
      '</div>' +
      '<div class="pc-acts">' +
        '<button type="button" data-act="edit" data-pid="' + p.id + '">编辑</button>' +
        '<button type="button" data-act="del" data-pid="' + p.id + '" class="del">删除</button>' +
      '</div>' +
    '</div>';
  }).join('');

  $$('#patientGrid .pat-card').forEach(function(card){
    card.addEventListener('click', function(e){
      if (e.target.closest('.pc-acts')) return;
      store.currentId = Number(card.dataset.pid);
      saveStore();
      renderPatientUI(); renderList(); updateCount();
      switchPage('detail');
    });
  });
  $$('#patientGrid button[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var pid = Number(btn.dataset.pid);
      var p = store.patients.find(function(x){ return x.id === pid; });
      if (!p) return;
      if (btn.dataset.act === 'edit') editPatient(p);
      if (btn.dataset.act === 'del') {
        var t = calcTotals(p);
        if (!confirm('确定删除患者「' + (p.name || '未命名') + '」？\n将同时删除其 ' + t.count + ' 条护理记录，不可恢复。')) return;
        store.patients = store.patients.filter(function(x){ return x.id !== pid; });
        if (store.currentId === pid) {
          store.currentId = store.patients.length ? store.patients[0].id : null;
        }
        saveStore();
        renderPatients(); renderPatientUI(); renderList(); updateCount();
        toast('已删除患者「' + esc(p.name || '未命名') + '」');
      }
    });
  });
}

var phrases = [];        // 用户自定义短语
var phraseUseCustom = []; // 使用统计，暂时不用

function loadPhrases(){
  try { phrases = JSON.parse(localStorage.getItem(PHRASE_KEY) || '[]'); } catch(e){ phrases = []; }
  if (!Array.isArray(phrases)) phrases = [];
}
function savePhrases(){ localStorage.setItem(PHRASE_KEY, JSON.stringify(phrases)); }

function renderPhraseSelect(){
  var sel = $('#phraseSelect');
  if (!sel) return;
  var cur = sel.value;
  var html = '<option value="">📌 快捷短语…</option>';

  // 分组：先内置
  var groups = {};
  BUILTIN_PHRASES.forEach(function(p, i){
    if (!groups[p.group]) groups[p.group] = [];
    groups[p.group].push({ text: p.text, idx: 'b' + i });
  });
  Object.keys(groups).forEach(function(g){
    html += '<optgroup label="— ' + esc(g) + ' —">';
    groups[g].forEach(function(item){
      var txt = item.text.length > 42 ? item.text.slice(0, 42) + '…' : item.text;
      html += '<option value="' + item.idx + '">' + esc(txt) + '</option>';
    });
    html += '</optgroup>';
  });

  // 自定义短语
  if (phrases.length) {
    html += '<optgroup label="— 我的短语 —">';
    phrases.forEach(function(t, i){
      var txt = t.length > 42 ? t.slice(0, 42) + '…' : t;
      html += '<option value="c' + i + '">' + esc(txt) + '</option>';
    });
    html += '</optgroup>';
  }

  sel.innerHTML = html;
  if (cur !== '' && sel.querySelector('option[value="' + cur + '"]')) sel.value = cur;
}
function applyPhraseVal(val){
  var text = '';
  if (val.charAt(0) === 'b') {
    var i = Number(val.slice(1));
    if (BUILTIN_PHRASES[i]) text = BUILTIN_PHRASES[i].text;
  } else if (val.charAt(0) === 'c') {
    var j = Number(val.slice(1));
    if (phrases[j]) text = phrases[j];
  }
  if (!text) return;
  var ta = $('#fNotes');
  var prefix = ta.value && !ta.value.endsWith('\n') ? '\n' : '';
  ta.value = ta.value + prefix + text;
  autoGrow(ta);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  $('#phraseSelect').value = '';
}

function renderPhraseList(){
  var box = $('#phraseList');
  if (!box) return;
  if (!phrases.length) {
    box.innerHTML = '<div style="text-align:center;color:var(--sub);padding:20px 10px">还没有自定义短语，请在上方添加</div>';
    return;
  }
  box.innerHTML = phrases.map(function(t, i){
    return '<div class="phrase-item"><span>' + esc(t) + '</span><button type="button" data-i="' + i + '">删除</button></div>';
  }).join('');
  $$('#phraseList button[data-i]').forEach(function(btn){
    btn.onclick = function(){
      var i = Number(btn.dataset.i);
      if (!confirm('删除该短语？')) return;
      phrases.splice(i, 1);
      savePhrases();
      renderPhraseList();
      renderPhraseSelect();
    };
  });
}
function addPhrase(){
  var inp = $('#newPhraseInput');
  var t = inp.value.trim();
  if (!t) { toast('请输入短语内容'); return; }
  if (phrases.indexOf(t) >= 0) { toast('该短语已存在'); return; }
  phrases.push(t);
  savePhrases();
  inp.value = '';
  renderPhraseList();
  renderPhraseSelect();
  inp.focus();
}

/* ================= 记录列表 ================= */
function rowKV(k, v){
  if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) return '';
  var text = Array.isArray(v) ? v.join('、') : String(v);
  return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(text) + '</span></div>';
}
function recCard(r){
  var vitals = [];
  if (r.temp)  vitals.push('T ' + r.temp + '℃');
  if (r.pulse) vitals.push('P ' + r.pulse);
  if (r.hr)    vitals.push('HR ' + r.hr);
  if (r.rr)    vitals.push('R ' + r.rr);
  if (r.bp)    vitals.push('BP ' + r.bp + 'mmHg');
  if (r.spo2)  vitals.push('SpO₂ ' + r.spo2 + '%');
  var pupil = [];
  if (r.pupilL || r.pupilR) pupil.push('左' + (r.pupilL || '-') + 'mm/右' + (r.pupilR || '-') + 'mm');
  if (r.lightL && r.lightL.length) pupil.push('左光反应 ' + r.lightL.join('、'));
  if (r.lightR && r.lightR.length) pupil.push('右光反应 ' + r.lightR.join('、'));
  var intake = (r.intake || []).map(function(i){ return i.name + ' ' + i.ml + 'ml'; }).join('；');
  var output = (r.output || []).map(function(i){ return i.name + ' ' + i.ml + 'ml' + (i.color ? '（' + i.color + '）' : ''); }).join('；');
  var body = [
    vitals.length ? rowKV('生命体征', vitals.join('  ')) : '',
    pupil.length ? rowKV('瞳孔', pupil.join('；')) : '',
    rowKV('意识', r.consciousness), rowKV('皮肤', r.skin), rowKV('管道护理', r.pipeline),
    rowKV('输液局部', r.infusion), rowKV('患肢血运', r.limb), rowKV('伤口敷料', r.dressing),
    rowKV('体位', r.position), rowKV('吸氧', r.oxygen ? r.oxygen + ' 升/分' : ''),
    rowKV('处置', r.disposal), rowKV('安全措施', r.safety), rowKV('基础护理', r.nursing),
    rowKV('入量', intake), rowKV('出量', output),
    rowKV('其他观察及措施', r.notes), rowKV('护士签名', r.nurse)
  ].join('');
  return '<div class="rec">' +
    '<div class="rec-hd">' +
      '<span class="rec-t">' + esc(r.date || '') + ' ' + esc(r.time || '') + '</span>' +
      '<span class="rec-acts">' +
        '<button type="button" data-act="edit" data-id="' + r.id + '">编辑</button>' +
        '<button type="button" data-act="copy" data-id="' + r.id + '">复制</button>' +
        '<button type="button" data-act="del"  data-id="' + r.id + '">删除</button>' +
      '</span>' +
    '</div>' +
    '<div>' + (body || '<div class="kv"><span class="v" style="color:#9aa4b2">（无内容）</span></div>') + '</div>' +
  '</div>';
}
function sortedRecords(){
  return getRecords().slice().sort(function(a, b){
    return (String(a.date) + String(a.time)).localeCompare(String(b.date) + String(b.time));
  });
}
function renderList(){
  var box = $('#listBox');
  var recs = getRecords();
  if (!recs.length) {
    box.innerHTML = '<div class="empty"><span class="big">🗂</span>暂无记录<br>点击上方「新增抢救记录」开始录入</div>';
    return;
  }
  box.innerHTML = sortedRecords().reverse().map(recCard).join('');
}

function setVal(id, v){ var el = $('#' + id); if (el) el.value = v == null ? '' : v; }
function applyRecord(r, opts){
  opts = opts || {};
  editingId = opts.newId ? null : r.id;
  setVal('rDate', r.date || todayStr()); setVal('rTime', r.time || timeStr());
  setVal('fTemp', r.temp); setVal('fPulse', r.pulse); setVal('fHr', r.hr);
  setVal('fRr', r.rr); setVal('fBp', r.bp); setVal('fSpo2', r.spo2);
  setVal('pupL', r.pupilL); setVal('pupR', r.pupilR);
  setVal('fOxygen', r.oxygen); setVal('fDisposal', r.disposal);
  setVal('fNotes', r.notes); setVal('fNurse', r.nurse);
  Object.keys(GROUPS).forEach(function(k){ setGroup(k, r[k] || []); });
  $('#intakeBox').innerHTML = ''; (r.intake && r.intake.length ? r.intake : [{}]).forEach(addIntake);
  $('#outputBox').innerHTML = ''; (r.output && r.output.length ? r.output : [{}]).forEach(addOutput);
  autoGrow($('#fNotes'));

var REC_MARK = /【REC:([\s\S]*?)】/;
function recToClipboard(r){ return recToText(r) + '\n\n【REC:' + JSON.stringify(r) + '】'; }
function copyRecord(rec){
  var text = recToClipboard(rec);
  var done = function(){ toast('已复制，可到记录页点「粘贴记录」生成新记录'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败'); }
    ta.remove();
  }
}
/* 关键改动：粘贴后直接打开录入页，方便修改 */
function handlePasteText(text){
  if (!text || !String(text).trim()) { toast('没有可粘贴的内容'); return; }
  var p = curPatient();
  if (!p) { toast('请先选择患者'); return; }
  var rec = null;
  var m = String(text).match(REC_MARK);
  if (m) { try { rec = JSON.parse(m[1]); } catch(e){} }
  if (!rec) {
    try { var j = JSON.parse(text); if (j && typeof j === 'object' && j.date !== undefined) rec = j; } catch(e){}
  }
  if (!rec) { toast('未能识别，请使用「复制」按钮复制的记录内容'); return; }
  rec = JSON.parse(JSON.stringify(rec));
  rec.id = uid(); rec.savedAt = nowFull();
  if (!rec.date) rec.date = todayStr();
  if (!rec.time) rec.time = timeStr();
  if (rec.age && !rec.ageUnit) rec.ageUnit = '岁';

  // 关键：不直接保存，而是带入录入页
  applyRecord(rec, { newId: true });

  setVal('rDate', todayStr()); setVal('rTime', timeStr());
  setVal('fSignTime', nowFull());

}

function doPaste(){
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText()
      .then(function(t){
        if (t && t.trim()) {
          handlePasteText(t);
        } else {
          // 剪贴板为空 → 提供选择记录
          openPasteChooser();
        }
      })

  } else openPasteChooser();
}

function recToText(r){
  var L = [];
  L.push('【护理抢救记录】' + (r.date || '') + ' ' + (r.time || ''));
  if (r.name) L.push('姓名：' + r.name + '  性别：' + (r.gender || '') + '  年龄：' + (r.age ? r.age + (r.ageUnit || '岁') : '') + '  门诊号：' + (r.mrn || ''));
  if (r.diagnosis) L.push('诊断：' + r.diagnosis);
  var v = [];
  if (r.temp)  v.push('体温 ' + r.temp + '℃');
  if (r.pulse) v.push('脉搏 ' + r.pulse + '次/分');
  if (r.hr)    v.push('心率 ' + r.hr + '次/分');
  if (r.rr)    v.push('呼吸 ' + r.rr + '次/分');
  if (r.bp)    v.push('血压 ' + r.bp + 'mmHg');
  if (r.spo2)  v.push('SpO₂ ' + r.spo2 + '%');
  if (v.length) L.push(v.join('  '));
  if (r.pupilL || r.pupilR) L.push('瞳孔：左 ' + (r.pupilL || '-') + 'mm，右 ' + (r.pupilR || '-') + 'mm');
  function add(k, key, val) { if (val && val.length) L.push(k + '：' + toCodes(key, val)); }
  add('左光反应','lightL', r.lightL); add('右光反应','lightR', r.lightR);
  add('意识','consciousness', r.consciousness); add('皮肤','skin', r.skin);
  add('管道护理','pipeline', r.pipeline); add('输液局部','infusion', r.infusion);
  add('患肢血运','limb', r.limb); add('伤口敷料','dressing', r.dressing);
  add('体位','position', r.position);
  if (r.oxygen) L.push('吸氧：' + r.oxygen + ' 升/分');
  if (r.disposal) L.push('处置：' + r.disposal);
  add('安全措施','safety', r.safety); add('基础护理','nursing', r.nursing);
  if (r.intake && r.intake.length) L.push('入量：' + r.intake.map(function(i){ return i.name + ' ' + i.ml + 'ml'; }).join('；'));
  if (r.output && r.output.length) L.push('出量：' + r.output.map(function(i){ return i.name + ' ' + i.ml + 'ml' + (i.color ? '（' + i.color + '）' : ''); }).join('；'));
  if (r.notes) L.push('其他观察及措施：' + r.notes);
  if (r.nurse) L.push('护士签名：' + r.nurse);
  return L.join('\n');
}

function paginatePages(list, p, pt){
  var pages = []; var cur = [];
  list.forEach(function(r){

    if (cur.length > 1 && measureRows(cur, p, pt) > PAGE_H_PX) { cur.pop(); pages.push(cur); cur = [r]; }

  if (cur.length) pages.push(cur);
  return pages;
}

function doPrint(){
  var p = curPatient();
  var list = p ? sortedRecords() : [];
  if (!list.length) { toast('暂无记录可打印'); return; }
  var best = null;
  for (var t = 10.5; t >= 7.5; t -= 0.5) {
    var pt = Math.round(t * 10) / 10;
    var pages = paginatePages(list, p, pt);
    if (!best || pages.length < best.pages.length) { best = { pages: pages, pt: pt }; if (pages.length === 1) break; }
  }
  var total = best.pages.length;
  var area = $('#printArea');
  area.innerHTML = best.pages.map(function(rows, i){ return buildPrintDocPage(rows, p, best.pt, i + 1, total); }).join('');
  setTimeout(function(){
    window.print();
    if (total > 1) toast('已分为 ' + total + ' 页打印');
    else if (best.pt < 10.4) toast('内容较多，已自动缩小字号');
  }, 220);
}

function splitRow(line){
  if (line.indexOf('\t') >= 0) return line.split('\t').map(function(s){ return s.trim(); });
  if (line.indexOf('|') >= 0) {
    var parts = line.split('|');
    if (parts.length && parts[0].trim() === '') parts.shift();
    if (parts.length && parts[parts.length - 1].trim() === '') parts.pop();
    return parts.map(function(s){ return s.trim(); });
  }
  if (line.indexOf(',') >= 0 && !/^\s*<\w/.test(line)) return line.split(',').map(function(s){ return s.trim(); });
  return [line.trim()];
}
function textToRows(text){
  var lines = String(text).replace(/\r\n?/g, '\n').split('\n').filter(function(l){ return l.trim() !== ''; });
  return lines.map(function(l){ return splitRow(l); });
}
function normalizeDate(s){
  var m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? m[1] + '-' + pad(m[2]) + '-' + pad(m[3]) : '';
}
function normalizeTime(s){
  var m = String(s || '').match(/(\d{1,2}):(\d{2})/);
  return m ? pad(m[1]) + ':' + m[2] : '';
}
function parsePatientText(text){
  var keys = ['科室','床号','姓名','性别','年龄','门诊号','入院日期','诊断'];
  var hits = [];
  keys.forEach(function(k){
    var re = new RegExp(k + '[：:]', 'g');
    var m;
    while ((m = re.exec(text))) hits.push({ k: k, start: m.index, valStart: m.index + m[0].length });
  });
  hits.sort(function(a, b){ return a.start - b.start; });
  var out = {};
  hits.forEach(function(h, i){
    var end = i + 1 < hits.length ? hits[i + 1].start : text.length;
    out[h.k] = text.slice(h.valStart, end).replace(/[\s\u3000]+/g, ' ').trim();
  });
  return out;
}
function rowsToData(rows){
  var patient = {};
  var headerIdx = -1;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i]; if (!r || !r.length) continue;
    var joined = r.join(' ');
    if (!patient['姓名'] && /姓名\s*[：:]/.test(joined)) patient = parsePatientText(joined);
    if (String(r[0] || '').trim() === '日期' && String(r[1] || '').trim() === '时间') { headerIdx = i; break; }
  }
  var out = {};
  if (patient['科室']) out.dept = patient['科室'];
  if (patient['床号'] !== undefined) out.bed = patient['床号'];
  if (patient['姓名']) out.name = patient['姓名'];
  if (patient['性别']) out.gender = /男/.test(patient['性别']) ? '男' : '女';
  if (patient['年龄']) {
    var m = String(patient['年龄']).match(/(\d+(?:\.\d+)?)\s*(岁|月|日|天)?/);
    if (m) { out.age = m[1]; out.ageUnit = (m[2] === '天' ? '日' : (m[2] || '岁')); }
  }
  if (patient['门诊号']) out.mrn = patient['门诊号'];
  if (patient['入院日期']) { var d = normalizeDate(patient['入院日期']); if (d) out.admitDate = d; }
  if (patient['诊断']) out.diagnosis = patient['诊断'];
  var records = [];
  if (headerIdx >= 0) {
    var cur = null; var lastDate = out.admitDate || todayStr();
    for (var j = headerIdx + 1; j < rows.length; j++) {
      var cells = (rows[j] || []).map(function(c){ return String(c || '').trim(); });
      if (!cells.length || cells.every(function(c){ return !c; })) continue;
      var joined2 = cells.join('');
      var d0 = normalizeDate(cells[0]); var t1 = normalizeTime(cells[1]);
      if (!d0 && !t1 && /大小|光反应|左\s*mm|右\s*mm/.test(joined2)) continue;
      if (d0) lastDate = d0;
      if (d0 || t1) { cur = makeRecFromCells(cells, lastDate); records.push(cur); }
      else if (cur) { var n = (cells[28] || '').trim(); if (n) cur.notes = (cur.notes || '') + n; }
    }
  }
  return { patient: out, records: records };
}
function makeRecFromCells(cells, dateFallback){
  var get = function(i){ return (cells[i] || '').trim(); };
  var rec = {
    id: uid(),
    date: normalizeDate(get(0)) || dateFallback || todayStr(),
    time: normalizeTime(get(1)) || '00:00',
    temp: get(2), pulse: get(3), hr: get(4), rr: get(5), bp: get(6), spo2: get(7),
    pupilL: get(8), pupilR: get(9),
    lightL: fromCodes('lightL', get(10)), lightR: fromCodes('lightR', get(11)),
    consciousness: fromCodes('consciousness', get(12)), skin: fromCodes('skin', get(13)),
    pipeline: fromCodes('pipeline', get(14)), infusion: fromCodes('infusion', get(15)),
    limb: fromCodes('limb', get(16)), dressing: fromCodes('dressing', get(17)),
    position: fromCodes('position', get(18)),
    oxygen: get(19), disposal: get(20),
    safety: fromCodes('safety', get(21)), nursing: fromCodes('nursing', get(22)),
    intake: [], output: [],
    notes: get(28), nurse: get(29), savedAt: nowFull()
  };
  var inName = get(23), inMl = get(24);
  if (inName || inMl) rec.intake.push({ name: inName, ml: inMl });
  var outName = get(25), outMl = get(26), outColor = get(27);
  if (outName || outMl) rec.output.push({ name: outName, ml: outMl, color: outColor });
  return rec;
}

    openModal('账号',
      '<div style="text-align:center;padding:10px 0 20px">' +
        '<div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#4285f4);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:750;margin-bottom:12px">' + esc(((currentUser && currentUser.name) || '护').charAt(0)) + '</div>' +
        '<div style="font-size:18px;font-weight:750">' + esc((currentUser && currentUser.name) || '护士') + (currentUser && currentUser.isAdmin ? '<span class="admin-badge">管理员</span>' : '') + '</div>' +
        '<div style="font-size:13px;color:var(--sub);margin-top:6px">已登录 · 数据保存在本地浏览器</div>' +
      '</div>',
      '<button class="btn ghost" id="btnCloseUser" type="button">关闭</button>' +
      '<button class="btn danger" id="btnLogout" type="button">退出登录</button>'
    );
    $('#btnCloseUser').onclick = closeModal;
    $('#btnLogout').onclick = function(){ closeModal(); logout(); };
  };
  var btnAdmin = $('#btnAdminBar');
  if (btnAdmin) btnAdmin.onclick = openAdminPanel;

  // 患者管理
  $('#btnNewPatient').onclick = newPatient;
  $('#btnImportPatient').onclick = openImportModal;
  $('#patSearch').addEventListener('input', renderPatients);
  $('#btnBackToPatients').onclick = function(){ switchPage('patients'); renderPatients(); };
  $('#btnEditPatient').onclick = function(){ var p = curPatient(); if (p) editPatient(p); };
  $('#btnExportExcel').onclick = exportExcel;
  $('#btnPrintRecord').onclick = function(){
    var p = curPatient();
    if (!p || !(p.records || []).length) { toast('暂无记录可打印'); return; }
    if (confirm('建议先导出 Excel 备份，是否现在打印？\n\n点击"确定"直接打印，点击"取消"可先导出。')) doPrint();
  };
  $('#btnAddRecord').onclick = function(){ resetForm(); switchPage('entry'); };
  $('#btnPasteRecord').onclick = doPaste;
  $('#btnClearRecords').onclick = function(){
    var p = curPatient();
    if (!p || !p.records || !p.records.length) { toast('暂无记录'); return; }
    if (confirm('确定清空当前患者的全部 ' + p.records.length + ' 条记录？此操作不可恢复。')) {
      p.records = []; saveStore();
      renderList(); updateCount(); renderDetailHead(); renderPatients();
      toast('已清空');
    }
  };

  // 录入页
  Object.keys(P_FIELDS).forEach(function(id){
    var el = $('#' + id);
    if (el) { el.addEventListener('input', onPatientInput); el.addEventListener('change', onPatientInput); }
  });
  $('#btnBackFromEntry').onclick = function(){ switchPage('detail'); };
  $('#addIntake').onclick = function(){ addIntake(); };
  $('#addOutput').onclick = function(){ addOutput(); };
  $('#btnSave').onclick = saveRecord;
  $('#btnResetForm').onclick = function(){ if (confirm('确定清空当前填写内容？')) { resetForm(); toast('已清空'); } };
  $('#btnPickRec').onclick = openPickRecord;

  // 快捷短语
  $('#phraseSelect').addEventListener('change', function(e){
    var val = e.target.value;
    if (val === '') return;
    applyPhraseVal(val);
  });
  $('#btnManagePhrase').onclick = openPhraseManager;

  // 记录列表操作
  $('#listBox').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var id = Number(btn.dataset.id);
    var p = curPatient();
    if (!p) return;
    var rec = (p.records || []).find(function(r){ return r.id === id; });
    if (!rec) return;
    if (btn.dataset.act === 'edit') {
      applyRecord(rec); switchPage('entry');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      toast('正在编辑该记录');
    }
    if (btn.dataset.act === 'del') {
      if (confirm('确定删除该条记录？')) {
        p.records = p.records.filter(function(r){ return r.id !== id; });
        saveStore(); renderList(); updateCount(); renderDetailHead(); renderPatients();
        toast('已删除');
      }
    }
    if (btn.dataset.act === 'copy') copyRecord(rec);
  });

  // 底部 tab
  $$('.tabbar button').forEach(function(b){
    b.onclick = function(){
      var page = b.dataset.page;
      if (page === 'detail' && !curPatient()) { toast('请先选择患者'); switchPage('patients'); return; }
      if (page === 'entry' && !curPatient()) { toast('请先选择患者'); switchPage('patients'); return; }
      if (page === 'detail') renderDetailHead();
      switchPage(page);
    };
  });

  // Modal
  $('#modalClose').onclick = closeModal;
  $('#modal').addEventListener('click', function(e){ if (e.target === $('#modal')) closeModal(); });

  // 自动增长
  var notes = $('#fNotes');
  notes.addEventListener('input', function(){ autoGrow(notes); });

  // 一键到顶/到底
  $('#fabTop').onclick = scrollToTop;
  $('#fabBottom').onclick = scrollToBottom;
  window.addEventListener('scroll', updateScrollFabs, { passive: true });
  window.addEventListener('resize', updateScrollFabs);
}

function initApp(){
  loadStore();
  loadPhrases();
  bindApp();
  mountGroups();
  renderPhraseSelect();
  renderPatients();
  if (curPatient()) { renderPatientUI(); renderList(); updateCount(); }
  else { renderPatientUI(); }
  setVal('rDate', todayStr()); setVal('rTime', timeStr()); setVal('fSignTime', nowFull());
  $('#intakeBox').innerHTML = ''; addIntake();
  $('#outputBox').innerHTML = ''; addOutput();
  autoGrow($('#fNotes'));
  switchPage('patients');
  updateScrollFabs();
}

/* ================= 启动 ================= */
loadUsers();
loadSession();
bindAuth();

if (currentUser) {
  $('#authPage').classList.add('hidden');
  $('#mainApp').classList.remove('hidden');
  initApp();
  updateTopSub();
} else {
  switchAuthTab('login');
  if (users.length === 0) {
    $('#loginName').placeholder = '首次使用请先注册';
  }
}
</script>
</body>
</html>
